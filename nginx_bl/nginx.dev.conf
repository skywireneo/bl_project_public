worker_processes auto;

events {
    worker_connections 4096;
    use epoll;
}

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;

    limit_req_zone $binary_remote_addr zone=api:20m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=telegram:10m rate=3r/s;
    limit_req_zone $binary_remote_addr zone=socket:10m rate=20r/s;

    limit_req_status 429;

    log_format with_ip '$remote_addr - $http_x_forwarded_for - $http_x_real_ip [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'req_status:$limit_req_status req_id:$request_id';
    access_log /dev/stdout with_ip;
    error_log /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    error_page 401 /errors/401.html;
    error_page 403 /errors/403.html;
    error_page 404 /errors/404.html;
    error_page 423 /errors/423.html;
    error_page 429 /errors/429.html;
    error_page 451 /errors/451.html;
    error_page 500 /errors/500.html;
    error_page 502 /errors/502.html;
    error_page 503 /errors/503.html;
    error_page 504 /errors/504.html;

    proxy_intercept_errors on;

    upstream access_gate_ms_bl { 
        server access_gate_ms_bl:3000; 
        keepalive 32;
    }
    upstream backend_bl { 
        server backend_bl:3000; 
        keepalive 64; 
    }
    upstream frontend_bl { 
        server frontend_bl:5173; 
        keepalive 16; 
    }
    upstream files_control_service_bl { 
        server files_control_service_bl:3003; 
        keepalive 32; 
    }

    server {
        listen 80;
        server_name localhost;

        location /errors/ {
            root /etc/nginx;
            internal;
        }

        location = /check_site_proxy {
            internal;
            set $original_uri $uri;
            set $original_args $args;
            rewrite ^ /accessgate/status?$args break;
            
            proxy_pass http://access_gate_ms_bl;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Request-Id $request_id;
            
            proxy_hide_header Cache-Control;
            proxy_hide_header Pragma;
            proxy_hide_header Expires;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        }
        
        location /accessgate {
            limit_req zone=api burst=20; 
            
            proxy_pass http://access_gate_ms_bl;
            proxy_http_version 1.1; 
            proxy_set_header Connection ""; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
            
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location /socket.io/ {
            proxy_pass http://backend_bl;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
            
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }

        location /sys {
            limit_req zone=api burst=20;
            
            access_by_lua_block {
                local args = ngx.var.args
                local res = ngx.location.capture("/check_site_proxy?" .. (args or ""))
                local code = res.header["X-Error-Code"] or "200"
                local bypass = res.header["X-Bypass-Access"] or "false"
                
                if bypass == "true" then
                    ngx.header["Set-Cookie"] = "Access-Bypass=true; Max-Age=86400; Path=/"
                end

                if code ~= "200" then
                    ngx.status = tonumber(code)
                    return ngx.exec("/errors/" .. code .. ".html")
                end
            }

            proxy_pass http://backend_bl;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s; 
            proxy_set_header X-Request-Id $request_id;
        }

        location = /wiki {
            return 301 /wiki/;
        }

        location ^~ /wiki/ {
            set $wiki_dir "site_public";

            access_by_lua_block {
                local res = ngx.location.capture("/check_site_proxy?" .. (ngx.var.args or ""))
                local wiki_role = res.header["X-Wiki-Access"] or "denied"

                if wiki_role == "denied" then
                    ngx.status = 403
                    return ngx.exec("/errors/403.html")
                end

                if wiki_role == "admin" then
                    ngx.var.wiki_dir = "site_admin"
                elseif wiki_role == "moderator" then
                    ngx.var.wiki_dir = "site_moderator"
                else
                    ngx.var.wiki_dir = "site_public"
                end
            }

            alias /opt/project_consulting_agency/wiki_data/$wiki_dir/;
            index index.html;
            try_files $uri $uri/ $uri/index.html $uri.html =404;
        }

        location /files {
            limit_req zone=api burst=20;
            
            access_by_lua_block {
                local args = ngx.var.args
                local res = ngx.location.capture("/check_site_proxy?" .. (args or ""))
                local code = res.header["X-Error-Code"] or "200"
                local bypass = res.header["X-Bypass-Access"] or "false"
                
                if bypass == "true" then
                    ngx.header["Set-Cookie"] = "Access-Bypass=true; Max-Age=86400; Path=/"
                end

                if code ~= "200" then
                    ngx.status = tonumber(code)
                    return ngx.exec("/errors/" .. code .. ".html")
                end
            }
            
            proxy_pass http://files_control_service_bl;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_set_header X-Request-Id $request_id;
        }

        location / {
            access_by_lua_block {
                local args = ngx.var.args
                local res = ngx.location.capture("/check_site_proxy?" .. (args or ""))
                local code = res.header["X-Error-Code"] or "200"
                local bypass = res.header["X-Bypass-Access"] or "false"
                
                if bypass == "true" then
                    ngx.header["Set-Cookie"] = "Access-Bypass=true; Max-Age=86400; Path=/"
                end

                if code ~= "200" then
                    ngx.status = tonumber(code)
                    return ngx.exec("/errors/" .. code .. ".html")
                end
            }

            proxy_pass http://frontend_bl;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
        
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
}