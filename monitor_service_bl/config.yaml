# ===========================
# Настройки cron-задач мониторинга
# ===========================
# Расписание можно задавать тремя способами:
#
# 1interval_seconds: 60
#     → каждые 60 секунд (простой вариант)
#
# 2every: "5 minutes"
#     → каждые 5 минут, "10 seconds", "2 hours", "1 day"
#
# 3cron: "*/15 * * * *"
#     → классический формат CRON (как в Linux)
#
# ---------------------------
# Формат CRON-расписания:
# ---------------------------
# ┌───────────── минута (0 - 59)
# │ ┌───────────── час (0 - 23)
# │ │ ┌───────────── день месяца (1 - 31)
# │ │ │ ┌───────────── месяц (1 - 12)
# │ │ │ │ ┌───────────── день недели (0 - 6, где 0 — воскресенье)
# │ │ │ │ │
# │ │ │ │ │
# * * * * *
#
# Примеры cron:
# ----------------
# "*/5 * * * *"        → каждые 5 минут
# "0 * * * *"          → каждый час, ровно в 00 минут
# "0 3 * * *"          → каждый день в 03:00 ночи
# "30 6 * * 1-5"       → по будням в 06:30
# "0 0 1 * *"          → первого числа каждого месяца, в полночь
# "*/10 8-20 * * *"    → каждые 10 минут с 8:00 до 20:00
# "0 9,18 * * 1-5"     → в 09:00 и 18:00 по будням
#
# Поддерживаются символы:
# - *   — любое значение
# - */N — каждый N-й интервал (например, каждые 5 минут: */5)
# - ,   — перечисление (например, 1,15,30)
# - -   — диапазон (например, 1-5)
#
# ---------------------------
# Дополнительно:
# ---------------------------
# api_key_env: имя переменной в .env, где хранится X-API-KEY
# method: GET или POST
# name: человекочитаемое название задачи
# url: адрес запроса
# ===========================

