root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/access_gate ./cmd/access_gate"
  bin = "tmp/access_gate"
  full_bin = ""
  delay = 1000
  include_ext = ["go"]
  exclude_dir = ["tmp", "vendor"]
  stop_on_error = true

[log]
  time = true

[color]
  main = "yellow"
  watcher = "cyan"
  build = "green"
  runner = "magenta"
