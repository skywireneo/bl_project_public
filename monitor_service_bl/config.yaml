  retention_days: 10 # Логи работы контейнеров за столько последних дней
  backups_last_count: 3 # Будет столько последних бекапов если backup_sql: true и х2 последних бекапов если backup_sql: false
  backup_sql: true # Вкл/выкл дамп в sql представлении
